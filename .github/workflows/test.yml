name: Test

on:
    push:
        branches: [ development, main ]
    pull_request:
        branches: [ development, main ]
    schedule:
        -   cron: 0 3 * * 1,3,5
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php: [ 8.2, 8.3, 8.4, 8.5 ]
            fail-fast: false
        steps:
            -   name: Checkout
                uses: actions/checkout@v2
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    tools: composer:v2
            -   name: Install dependencies
                run: composer update
            -   name: Run test suite
                run: composer run test
